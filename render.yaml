databases:
  - name: dashboard-analytics-db
    plan: free
    databaseName: dashboard_analytics
    user: dashboard_analytics

services:
  - type: web
    name: dashboard-analytics-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-analytics-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://dashboardfront-eta.vercel.app
